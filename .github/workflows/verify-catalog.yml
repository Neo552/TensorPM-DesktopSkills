name: Verify catalog

# The desktop Skill installer downloads exactly what catalog.json points at, so
# a catalog entry whose release asset is missing breaks install for every user
# with no earlier signal. This job downloads every published payload and checks
# it against the pinned sha256/size.
#
# The schedule matters as much as the push trigger: an asset can disappear long
# after the commit that added it (release deleted, tag retagged), and nothing
# else would notice.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify catalog against published release assets
        run: node scripts/verify-catalog.mjs --remote

      - name: Verify published payloads match a rebuild from source
        # Guards the recovery path, and catches a published payload that has
        # drifted from the skills/<id>/ tree it claims to come from. Compares
        # tar content, not the .tar.gz digest — gzip output is not portable
        # across zlib versions. Skills without source in this repo are skipped.
        run: node scripts/verify-reproducible.mjs
